name: iOS Store Assets

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture App Store screenshots
        type: boolean
        default: true
      signed_build:
        description: Build signed App Store archive
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  simulator:
    name: Capture App Store screenshots
    concurrency:
      group: ios-store-screenshots-${{ github.ref }}
      cancel-in-progress: false
    if: inputs.screenshots
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EAS_BUILD_PROFILE: ios-simulator
      EXPO_PUBLIC_PACKPROOF_BUILD_SHA: ${{ github.sha }}
      EXPO_PUBLIC_PACKPROOF_API_BASE_URL: https://pa-5faf90eb81cb4764b37bd3dc259a5ac4.ecs.us-east-1.on.aws
      EXPO_PUBLIC_PACKPROOF_AUTH_MODE: cognito
      EXPO_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_GdgTeYaOO
      EXPO_PUBLIC_COGNITO_CLIENT_ID: 34pnucunllka2jcs8hsq762m5e
      EXPO_PUBLIC_COGNITO_REGION: us-east-1
      EXPO_PUBLIC_PACKPROOF_IN_VIDEO_SHIPPING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
      - name: Select installed Xcode 26 or newer
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PY'
          import glob, re
          candidates = []
          for app in glob.glob('/Applications/Xcode_*.app'):
            match = re.search(r'Xcode_(\d+)\.(\d+)', app)
            if match and int(match[1]) >= 26 and 'beta' not in app.lower():
              candidates.append(((int(match[1]), int(match[2])), app))
          if not candidates: raise SystemExit('Xcode 26+ is required for the iOS release gate.')
          print(max(candidates)[1])
          PY
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
      - run: npm run test:ios
      - run: npm run test:proof-record
      - run: npm run test:recovery
      - name: Prepare isolated screenshot entry point
        env:
          PACKPROOF_STORE_SCREENSHOTS: '1'
        run: node store-assets/prepare.cjs
      - name: Verify cached simulator native sources
        run: |
          git fetch origin b3553f740034190e27c31588c2a57e8bdad2ebd1
          git diff --exit-code b3553f740034190e27c31588c2a57e8bdad2ebd1 HEAD -- package.json package-lock.json app.config.js plugins modules assets
      - uses: actions/download-artifact@v4
        with:
          name: packproof-ios-simulator-b3553f740034190e27c31588c2a57e8bdad2ebd1
          run-id: 36593225315
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-simulator-artifact
      - name: Rebundle current screens into verified native simulator app
        run: |
          ARCHIVE=$(find "$RUNNER_TEMP/native-simulator-artifact" -name PackProof-iOS-Simulator.zip -print -quit)
          test -n "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/simulator-app"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/simulator-app"
          APP_PATH="$RUNNER_TEMP/simulator-app/PackProof.app"
          test -f "$APP_PATH/Info.plist"
          npx expo export:embed --platform ios --dev false --entry-file index.ts --bundle-output "$APP_PATH/main.jsbundle" --assets-dest "$APP_PATH" --minify true
      - name: Capture native iPhone screens
        run: bash store-assets/capture.sh "$RUNNER_TEMP/simulator-app/PackProof.app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packproof-app-store-screenshots-${{ github.sha }}
          path: |
            mobile/dist/store-screenshots/
            ${{ runner.temp }}/ios-build.log

  app-store:
    name: Signed iOS archive
    if: github.ref == 'refs/heads/main' && inputs.signed_build
    concurrency:
      group: ios-store-signed-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_PACKPROOF_BUILD_SHA: ${{ github.sha }}
      PACKPROOF_IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Authenticate with existing Expo credential
        uses: ./.github/actions/expo-auth
      - name: Build with existing remote Apple signing credentials
        run: |
          mkdir -p dist
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          config.build['ios-testflight'].env.PACKPROOF_IOS_BUILD_NUMBER = process.env.PACKPROOF_IOS_BUILD_NUMBER;
          config.build['ios-testflight'].env.EXPO_PUBLIC_PACKPROOF_BUILD_SHA = process.env.EXPO_PUBLIC_PACKPROOF_BUILD_SHA;
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
          NODE
          npx --yes eas-cli@24.4.2 build --platform ios --profile ios-testflight --non-interactive --wait --json > dist/eas-ios-build.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('dist/eas-ios-build.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          if (build.status !== 'FINISHED' || !build.artifacts?.buildUrl) throw new Error('No completed signed iOS archive.');
          fs.writeFileSync('dist/ipa-url.txt', build.artifacts.buildUrl);
          NODE
          curl --fail --location "$(cat dist/ipa-url.txt)" --output dist/PackProof.ipa
          test -s dist/PackProof.ipa
          sha256sum dist/PackProof.ipa > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: packproof-ios-archive-${{ github.sha }}
          path: |
            mobile/dist/PackProof.ipa
            mobile/dist/eas-ios-build.json
            mobile/dist/SHA256SUMS
