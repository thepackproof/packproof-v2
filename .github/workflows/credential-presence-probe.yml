name: Credential presence probe

on:
  push:
    branches: [build/local-aab-2026-09-11]
    paths:
      - ".github/workflows/credential-presence-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      EXPO_AUTH_TOKEN: ${{ secrets.EXPO_AUTH_TOKEN }}
      EXPO_API_TOKEN: ${{ secrets.EXPO_API_TOKEN }}
      PACKPROOF_EXPO_TOKEN: ${{ secrets.PACKPROOF_EXPO_TOKEN }}
      PACKPROOF_EAS_TOKEN: ${{ secrets.PACKPROOF_EAS_TOKEN }}
      EXPO_TOKEN_PACKPROOF: ${{ secrets.EXPO_TOKEN_PACKPROOF }}
      EAS_TOKEN_PACKPROOF: ${{ secrets.EAS_TOKEN_PACKPROOF }}
      EAS_BUILD_TOKEN: ${{ secrets.EAS_BUILD_TOKEN }}
      ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
      PLAY_STORE_KEYSTORE: ${{ secrets.PLAY_STORE_KEYSTORE }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Report configured credential names only
        shell: bash
        run: |
          set -euo pipefail
          for name in EXPO_AUTH_TOKEN EXPO_API_TOKEN PACKPROOF_EXPO_TOKEN PACKPROOF_EAS_TOKEN EXPO_TOKEN_PACKPROOF EAS_TOKEN_PACKPROOF EAS_BUILD_TOKEN ANDROID_UPLOAD_KEY_BASE64 UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE PLAY_UPLOAD_KEYSTORE PLAY_STORE_KEYSTORE RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE KEYSTORE_PASSWORD STORE_PASSWORD KEY_ALIAS KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
