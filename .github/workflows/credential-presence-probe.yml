name: Credential presence probe

on:
  push:
    branches: [build/local-aab-2026-09-11]
    paths:
      - ".github/workflows/credential-presence-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
      EXPO_CLI_TOKEN: ${{ secrets.EXPO_CLI_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Report configured credential names only
        shell: bash
        run: |
          set -euo pipefail
          for name in EXPO_TOKEN EAS_TOKEN EXPO_ACCESS_TOKEN EAS_ACCESS_TOKEN EXPO_CLI_TOKEN ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
