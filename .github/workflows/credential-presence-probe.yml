name: Credential presence probe

on:
  push:
    branches: [build/local-aab-2026-09-11]
    paths:
      - ".github/workflows/credential-presence-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ACTION_SECRET_CONTEXT: ${{ toJson(secrets) }}
    steps:
      - name: Report configured secret names only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          payload = os.environ.get('ACTION_SECRET_CONTEXT', '{}')
          try:
              data = json.loads(payload)
          except Exception:
              data = {}
          names = sorted(str(k) for k in data.keys())
          print('configured_secret_names=' + (','.join(names) if names else '<none>'))
          PY
