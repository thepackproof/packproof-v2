name: Partner isolated infrastructure validation
on:
  pull_request:
    paths: ['infra/partner-foundation/**', 'backend/scripts/*recipient-storage*', '.github/workflows/partner-infrastructure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cfn-lint>=1,<2'
      - run: cfn-lint --version
      - run: cfn-lint --region us-east-1 --template infra/partner-foundation/*.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify recipient probe source and generated template
        run: |
          node --check backend/scripts/isolated-recipient-storage-probe.mjs
          node backend/scripts/generate-recipient-storage-infra.mjs
          git diff --exit-code -- infra/partner-foundation/recipient-storage-assets.json
      - name: Validate recipient storage security requirements
        run: |
          curl --fail --silent --show-error --location https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-linux-latest.tar.gz -o "$RUNNER_TEMP/cfn-guard.tar.gz"
          echo "8c66efb19c63e6c2bf26b9a41bbcf2f85baa8a937b01d350940194faaf64cf1d  $RUNNER_TEMP/cfn-guard.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/cfn-guard"
          tar -xzf "$RUNNER_TEMP/cfn-guard.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/cfn-guard"
          "$RUNNER_TEMP/cfn-guard/cfn-guard" validate --rules infra/partner-foundation/recipient-storage.guard --data infra/partner-foundation/recipient-storage-assets.json --output-format json --show-summary none
