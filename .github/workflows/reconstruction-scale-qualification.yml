name: Operational projection scale qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/records/**'
      - 'backend/migrations/**'
      - 'backend/scripts/reconstruction-scale.ts'
      - 'backend/package-lock.json'
      - '.github/workflows/reconstruction-scale-qualification.yml'
permissions:
  contents: read
concurrency:
  group: reconstruction-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postgres-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: packproof
          POSTGRES_PASSWORD: scale-fixture-only
          POSTGRES_DB: packproof_scale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packproof -d packproof_scale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Run isolated PostgreSQL retained-history and admission workload
        working-directory: backend
        env:
          PACKPROOF_TEST_DATABASE_URL: postgres://packproof:scale-fixture-only@127.0.0.1:5432/packproof_scale
          PACKPROOF_SCALE_ROWS: '1000000'
          PACKPROOF_SCALE_SHIPMENTS: '10000'
          PACKPROOF_SCALE_BURST_RATE: '100'
          PACKPROOF_SCALE_BURST_SECONDS: '10'
          PACKPROOF_SCALE_SAMPLES: '30'
          PACKPROOF_SCALE_ENFORCE_TARGETS: 'true'
        run: node --import tsx scripts/reconstruction-scale.ts ../artifacts/reconstruction-scale-postgres.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-projection-postgres-scale
          path: artifacts/reconstruction-scale-postgres.json
          if-no-files-found: error
