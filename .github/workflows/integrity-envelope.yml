name: Integrity envelope conformance
on:
  pull_request:
    paths: ['backend/src/integrity/**', 'backend/src/http/envelope*.ts', 'backend/src/platform/partner-router.ts', 'backend/src/domain/recovery-*.ts', 'backend/migrations/**', 'backend/tests/envelope-*', 'backend/tests/recovery-restore.test.ts', 'backend/tests/versioned-memory-object-store.ts', 'backend/tests/verify-envelope-fixture.py', 'backend/scripts/*envelope*', 'infra/partner-foundation/envelope-*', 'backend/package*.json', 'verifier/**', '.github/workflows/integrity-envelope.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: envelope_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: envelope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r verifier/requirements-envelope.txt
      - run: npm ci
        working-directory: backend
      - name: Install media validation tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: npm run typecheck
        working-directory: backend
      - name: Validate isolated harness and generated template
        run: |
          node --check backend/scripts/isolated-envelope-control.mjs
          node --check backend/scripts/isolated-envelope-acceptance.mjs
          node backend/scripts/generate-envelope-acceptance-infra.mjs
          git diff --exit-code -- infra/partner-foundation/envelope-acceptance-assets.json
      - run: npx vitest run tests/envelope-profile.test.ts tests/envelope-package.test.ts tests/envelope-jobs.test.ts tests/envelope-s3-store.test.ts tests/envelope-trust.test.ts tests/envelope-publication.test.ts tests/envelope-access.test.ts tests/envelope-runtime.test.ts tests/envelope-budget.test.ts tests/recovery-restore.test.ts
        working-directory: backend
        env:
          PACKPROOF_ENVELOPE_TEST_DATABASE_URL: postgres://envelope_test:synthetic_ci_only@localhost:5432/envelope_test
          PACKPROOF_TEST_DATABASE_URL: postgres://envelope_test:synthetic_ci_only@localhost:5432/envelope_test
      - run: python -m unittest discover -s verifier -p 'test_*.py'
