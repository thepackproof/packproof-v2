name: Isolated Logistics owner migration
on:
  push:
    branches: [qa/logistics-129-owner]
permissions:
  contents: read
jobs:
  rollback-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: packproof_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d packproof_test" --health-interval 3s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Compare restored receipts, effective role grants, rehearsal rollback and idempotent application
        working-directory: backend
        env:
          PACKPROOF_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/packproof_test
        run: npm test -- tests/order-workspace-restored.test.ts --maxWorkers=1
