name: Foundation release operations
on:
  pull_request:
    paths: ['infra/backend-release/foundation-*', 'verifier/verify.py', 'verifier/test_signature_execution.py', '.github/workflows/foundation-release-operations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cfn-lint==1.57.2
      - run: cfn-lint --region us-east-1 --template infra/backend-release/foundation-migration-task.json
      - run: node --test infra/backend-release/foundation-deployment-plan.test.mjs
      - run: python -m unittest discover -s verifier -p test_signature_execution.py
      - name: Validate exact operator and buildspec syntax
        run: |
          node --check infra/backend-release/foundation-runtime-preflight.mjs
          node --input-type=module -e "import {readFileSync,readdirSync} from 'node:fs'; for (const f of readdirSync('infra/backend-release').filter(f=>f.startsWith('foundation-')&&f.endsWith('.json'))) JSON.parse(readFileSync('infra/backend-release/'+f,'utf8'));"
