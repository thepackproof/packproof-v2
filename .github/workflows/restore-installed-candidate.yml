name: Restore exact Windows candidate on a fresh hosted machine
on:
  push:
    branches: [qa/connect-restore-92]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore:
    if: github.repository == 'thepackproof/packproof-v2' && github.ref == 'refs/heads/qa/connect-restore-92'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - name: Verify originating run, exact ZIP, installer and declared source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& "$env:GITHUB_WORKSPACE/qa/infra/windows-restore/acquire.ps1"'
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ steps.candidate.outputs.source }}
          # The pinned legacy writer is fetched from the same private repository.
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Install the extracted service payload and restore protected native storage
        run: '& "$env:GITHUB_WORKSPACE/qa/infra/windows-restore/restore.ps1"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connect-localservice-restore-92-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/restore-report/restore.json
          if-no-files-found: warn
          retention-days: 90
