name: Connect Windows candidate
on:
  pull_request:
    paths: ['connect-windows/**', 'desktop/**', 'examples/multisource-journey/**', 'backend/src/records/order-*.ts', 'backend/tests/order-journey-*.test.ts', 'backend/tests/commerce-windows-journey.test.ts', 'backend/src/records/connect-csv-rules.json', 'backend/src/records/typed-source-rules.json', 'backend/src/records/source-contracts.ts', 'backend/src/records/source-profiles.ts', 'backend/tests/fixtures/connect-csv-corpus.json', 'backend/tests/fixtures/reconstruction/**', '.github/workflows/connect-windows*.yml']
  push:
    branches: [main]
    paths: ['connect-windows/**', 'desktop/**', 'examples/multisource-journey/**', 'backend/src/records/order-*.ts', 'backend/tests/order-journey-*.test.ts', 'backend/tests/commerce-windows-journey.test.ts', 'backend/src/records/connect-csv-rules.json', 'backend/src/records/typed-source-rules.json', 'backend/src/records/source-contracts.ts', 'backend/src/records/source-profiles.ts', 'backend/tests/fixtures/connect-csv-corpus.json', 'backend/tests/fixtures/reconstruction/**', '.github/workflows/connect-windows*.yml']
  workflow_dispatch:
    inputs:
      disposable_windows11:
        description: Run installer rehearsals on the preprovisioned disposable Windows 11 x64 runner
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: connect-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        working-directory: connect-windows
        shell: pwsh
    env:
      APP_ENV: development
      PACKPROOF_API_BASE_URL: ${{ vars.PACKPROOF_CONNECT_DEV_API_BASE_URL || 'https://pa-5faf90eb81cb4764b37bd3dc259a5ac4.ecs.us-east-1.on.aws' }}
      PACKPROOF_WEB_BASE_URL: https://dvpmnwc27i8tw.cloudfront.net
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            connect-windows/package-lock.json
            backend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: node ../examples/multisource-journey/journey.mjs self-check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: node --test tests/hosted-approval.test.mjs tests/connect-publication.test.cjs
      - run: node scripts/verify-hosted-approval.mjs
      - run: dotnet test service-tests/PackProof.Connect.Service.Tests.csproj -c Release
        env:
          PACKPROOF_JOURNEY_RECEIPT: ${{ github.workspace }}/connect-windows/build/order-journey-receipts.json
      - name: Verify controlled Windows reader receipts with the backend order projection
        working-directory: backend
        env:
          PACKPROOF_JOURNEY_PROJECTED: ${{ github.workspace }}/connect-windows/build/order-journey-projection.json
          PACKPROOF_JOURNEY_RECEIPT: ${{ github.workspace }}/connect-windows/build/order-journey-receipts.json
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec --offline -- vitest run tests/order-journey-receipts.test.ts
      - name: Install and locate the pinned Electron runtime
        timeout-minutes: 5
        run: node -e 'const fs=require("node:fs"); const exe=require("electron"); console.log("Electron",require("electron/package.json").version,exe,fs.statSync(exe).size,"bytes");'
      - name: Build the web portal for the isolated browser approval
        # This portal build uses the fixture login and is never published.
        working-directory: web
        shell: pwsh
        run: |
          npm ci --prefix ../mobile --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Approve collection in Chromium and verify the Windows service exports the resulting order
        working-directory: backend
        timeout-minutes: 5
        env:
          PACKPROOF_JOURNEY_REAL_HTTP: "1"
          PACKPROOF_JOURNEY_BROWSER: "1"
          PACKPROOF_JOURNEY_PERF_N: "20"
          PACKPROOF_JOURNEY_RESULT: ${{ github.workspace }}/connect-windows/build/http-journey-result.json
        run: npm exec --offline -- vitest run tests/order-journey-http.test.ts --maxWorkers=1
      - name: Qualify guided setup, two cartons, dispatch recovery and pinned PDF exports
        working-directory: backend
        timeout-minutes: 5
        env:
          PACKPROOF_JOURNEY_REAL_HTTP: "1"
          PACKPROOF_JOURNEY_CARTONS: "1"
          PACKPROOF_JOURNEY_BROWSER: "1"
          PACKPROOF_JOURNEY_RESULT: ${{ github.workspace }}/connect-windows/build/carton-journey-result.json
        run: npm exec --offline -- vitest run tests/order-journey-http.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@v4
        with:
          name: guided-carton-journey-${{ github.sha }}
          path: connect-windows/build/carton-journey-result.json
      - name: Compare the real local package to the Windows reader and backend projection
        env:
          PACKPROOF_JOURNEY_PROJECTED: ${{ github.workspace }}/connect-windows/build/order-journey-projection.json
          PACKPROOF_JOURNEY_OUTPUT: ${{ github.workspace }}/connect-windows/build/order-journey-output
        run: |
          dotnet test service-tests/PackProof.Connect.Service.Tests.csproj -c Release --no-build --filter FullyQualifiedName~Publish_controlled_projection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../examples/multisource-journey/verify-output.mjs "$env:PACKPROOF_JOURNEY_OUTPUT" "$env:PACKPROOF_JOURNEY_PROJECTED"
      - run: npm run build
      - name: Check the built renderer at supported scales with keyboard navigation
        timeout-minutes: 5
        run: node node_modules/electron/cli.js --disable-gpu scripts/check-renderer-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connect-renderer-layout-${{ github.sha }}
          path: connect-windows/build/renderer-layout.json
          if-no-files-found: ignore
      - run: npm run publish:native
      - run: npm run package:win
      - run: npm run verify:artifacts
      - name: Verify packaged workspace screens and capture light and dark walkthroughs
        timeout-minutes: 8
        run: node node_modules/electron/cli.js --disable-gpu scripts/check-renderer-layout.cjs --packaged-workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connect-workspace-walkthrough-${{ github.sha }}
          path: |
            connect-windows/build/workspace-layout.json
            connect-windows/build/order-journey-receipts.json
            connect-windows/build/http-journey-result.json
            connect-windows/build/workspace-screens/*.png
          if-no-files-found: error
      - name: Prepare pending encrypted work with the historical LocalService writer
        run: ./scripts/seed-legacy-queue-ci.ps1
      - name: Exercise actual LocalService protected storage and bridge
        run: ./scripts/smoke-native-foundation.ps1
      - name: Upgrade the historical partitioned queue with the packaged service
        run: ./scripts/smoke-legacy-queue-upgrade.ps1
      - name: Reject unhealthy installation and repair retained storage safely
        run: ./scripts/smoke-storage-repair.ps1
      - name: Qualify read-only Windows PowerShell 5.1 installation diagnostics
        run: '& "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File tests/installation-diagnostics.test.ps1'
      # Never publish an executable from a failed install/repair qualification.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: packproof-connect-DEVELOPMENT-win32-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            connect-windows/release/development/win32-x64/*.exe
            connect-windows/release/development/win32-x64/SHA256SUMS
            connect-windows/release/development/win32-x64/release-evidence.json
            connect-windows/release/development/win32-x64/build-provenance.json
            connect-windows/release/development/win32-x64/DEVELOPMENT-BUILD.txt
            connect-windows/release/development/win32-x64/native-foundation-smoke.json
            connect-windows/release/development/win32-x64/storage-repair-smoke.json
            connect-windows/release/development/win32-x64/legacy-queue-input.json
            connect-windows/release/development/win32-x64/legacy-queue-upgrade-smoke.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packproof-connect-failed-validation-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            connect-windows/release/development/win32-x64/native-foundation-smoke.json
            connect-windows/release/development/win32-x64/storage-repair-smoke.json
            connect-windows/release/development/win32-x64/legacy-queue-input.json
            connect-windows/release/development/win32-x64/legacy-queue-upgrade-smoke.json

  unified:
    name: Unified Windows workstation
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        working-directory: connect-windows
        shell: pwsh
    env:
      APP_ENV: development
      PACKPROOF_UNIFIED_WINDOWS: '1'
      PACKPROOF_API_BASE_URL: ${{ vars.PACKPROOF_CONNECT_DEV_API_BASE_URL || 'https://pa-5faf90eb81cb4764b37bd3dc259a5ac4.ecs.us-east-1.on.aws' }}
      PACKPROOF_WEB_BASE_URL: https://dvpmnwc27i8tw.cloudfront.net
      PACKPROOF_COGNITO_REGION: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_REGION || 'us-east-1' }}
      PACKPROOF_COGNITO_CLIENT_ID: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_CLIENT_ID || '34pnucunllka2jcs8hsq762m5e' }}
      PACKPROOF_COGNITO_USER_POOL_ID: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_USER_POOL_ID || 'us-east-1_GdgTeYaOO' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            backend/package-lock.json
            connect-windows/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix ../desktop --no-audit --no-fund
      - run: npm run build
      - name: Install the backend video validator for the Windows camera journey
        run: |
          if (-not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffprobe -version
      - name: Record a synthetic camera stream and verify the finalized Commerce Proof, original and share
        working-directory: backend
        timeout-minutes: 5
        env:
          PACKPROOF_JOURNEY_COMMERCE: '1'
          PACKPROOF_COMMERCE_RESULT: ${{ github.workspace }}/connect-windows/build/commerce-journey.json
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec --offline -- vitest run tests/commerce-windows-journey.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@v4
        with:
          name: commerce-camera-journey-${{ github.sha }}
          path: connect-windows/build/commerce-journey.json
          if-no-files-found: error
      - run: npm run publish:native
      - run: npm exec --offline -- electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never
      - run: npm run verify:artifacts
      - name: Verify actual unified host renderer, Logistics entry and access recovery at Windows scales
        timeout-minutes: 5
        run: node node_modules/electron/cli.js --disable-gpu ../desktop/scripts/check-unified-entry.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-windows-ux-evidence-${{ github.sha }}
          path: connect-windows/build/unified-ux-screens/**
          retention-days: 30
          if-no-files-found: ignore
      - name: Launch and restart the packaged Commerce host with Windows protected storage
        run: node ../desktop/scripts/native-launch-smoke.cjs
      - name: Qualify the unified package's installed LocalService bridge and collection identity
        run: ./scripts/smoke-native-foundation.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: packproof-unified-DEVELOPMENT-win32-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            connect-windows/release/development/win32-x64/*.exe
            connect-windows/release/development/win32-x64/SHA256SUMS
            connect-windows/release/development/win32-x64/release-evidence.json
            connect-windows/release/development/win32-x64/build-provenance.json
            connect-windows/release/development/win32-x64/native-launch-smoke.json
            connect-windows/release/development/win32-x64/native-foundation-smoke.json
      - name: Preserve startup and LocalService diagnostics after a failed package check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unified-windows-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            connect-windows/release/development/win32-x64/native-launch-smoke.json
            connect-windows/release/development/win32-x64/native-foundation-smoke.json
            connect-windows/build/commerce-journey.json

  installed:
    name: Unified Windows installer / ${{ matrix.mode }}
    needs: unified
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [Clean, Upgrade]
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.disposable_windows11 && fromJSON('["self-hosted","windows","x64","packproof-disposable-windows11"]') || 'windows-2025' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      APP_ENV: development
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PACKPROOF_DISPOSABLE_WINDOWS11: ${{ github.event_name == 'workflow_dispatch' && inputs.disposable_windows11 && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packproof-unified-DEVELOPMENT-win32-x64-${{ github.sha }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Obtain the frozen Commerce source for the upgrade input
        if: matrix.mode == 'Upgrade'
        uses: actions/checkout@v4
        with:
          ref: 63843c5616dce4ce5824015f975fd0ac6327012d
          path: previous
      - name: Build the previous standalone Commerce installer
        if: matrix.mode == 'Upgrade'
        working-directory: previous/desktop
        env:
          PACKPROOF_API_BASE_URL: ${{ vars.PACKPROOF_DESKTOP_DEV_API_BASE_URL || 'https://pa-5faf90eb81cb4764b37bd3dc259a5ac4.ecs.us-east-1.on.aws' }}
          PACKPROOF_WEB_BASE_URL: https://thepackproof.com
          PACKPROOF_COGNITO_REGION: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_REGION || 'us-east-1' }}
          PACKPROOF_COGNITO_CLIENT_ID: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_CLIENT_ID || '34pnucunllka2jcs8hsq762m5e' }}
          PACKPROOF_COGNITO_USER_POOL_ID: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_USER_POOL_ID || 'us-east-1_GdgTeYaOO' }}
        run: |
          $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package:win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run verify:artifacts
      - name: Verify the previous Connect installer archive and prepare the enrollment fixture
        if: matrix.mode == 'Upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVED_BASELINE: ${{ vars.PACKPROOF_CONNECT_060_QUALIFICATION_ARCHIVE_URL }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'packproof-connect-pr175.zip'
          if ($env:ARCHIVED_BASELINE) {
            $uri = [uri]$env:ARCHIVED_BASELINE
            if ($uri.Scheme -ne 'https' -or $uri.UserInfo) { throw 'Expected an HTTPS release archive location.' }
            Invoke-WebRequest -Uri $uri -OutFile $archive
          } else {
            Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/14587903702/zip" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -OutFile $archive
          }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '00279cff2fc00e14fdaba0126a1c9b7c356b93ed41ed982a60f34ea04dea001e') { throw 'Previous Connect release archive checksum mismatch.' }
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Rehearse the verified installers
        env:
          REHEARSAL_MODE: ${{ matrix.mode }}
        run: |
          $arguments = @{ Mode = $env:REHEARSAL_MODE; CandidateDirectory = (Resolve-Path 'candidate').Path }
          if ($env:REHEARSAL_MODE -eq 'Upgrade') {
            $arguments.PriorConnectArchive = Join-Path $env:RUNNER_TEMP 'packproof-connect-pr175.zip'
            $arguments.PriorCommerceDirectory = (Resolve-Path 'previous/desktop/release/development/win32-x64').Path
            $arguments.PriorCommerceSource = (Resolve-Path 'previous/desktop').Path
          }
          ./connect-windows/scripts/smoke-logistics-upgrade.ps1 @arguments
      - name: Preserve installed qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logistics-installed-${{ matrix.mode }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: candidate/logistics-install-${{ matrix.mode }}.json
