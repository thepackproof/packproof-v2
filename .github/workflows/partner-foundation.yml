name: Partner foundation gates
on:
  pull_request:
    paths: ['backend/**', 'examples/merchant-receiver/**', '.github/workflows/partner-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: packproof_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: packproof_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version
      - run: npm run typecheck
      - name: Focused foundation acceptance
        env:
          PACKPROOF_TEST_DATABASE_URL: postgres://packproof_test:synthetic_ci_only@localhost:5432/packproof_test
        run: npm test -- --run tests/organization-foundation.test.ts tests/commit-safe-event-stream.test.ts tests/partner-receiver.test.ts tests/finalize-signing-boundary.test.ts tests/partner-postgres-gate.test.ts --pool=threads --reporter=default --reporter=junit --outputFile=partner-foundation.xml
      - name: Reference adapter contract
        run: node --test ../examples/merchant-receiver/partner-client.test.mjs
      - name: Published contract and migration packaging compatibility
        run: npm test -- --run tests/public-platform.test.ts tests/rnd-migrate.test.ts tests/rnd-production-packaging.test.ts tests/aws-s3-object-integrity.test.ts --pool=threads
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partner-foundation-${{ github.sha }}
          path: backend/partner-foundation.xml
