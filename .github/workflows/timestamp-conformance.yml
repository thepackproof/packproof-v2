name: RFC 3161 timestamp conformance
on:
  pull_request:
    paths: ['backend/src/integrity/rfc3161*.ts', 'backend/tests/rfc3161*.ts', 'verifier/timestamp.py', 'verifier/test_timestamp.py', '.github/workflows/timestamp-conformance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: openssl version
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npx vitest run tests/rfc3161.test.ts tests/rfc3161-client.test.ts
        working-directory: backend
