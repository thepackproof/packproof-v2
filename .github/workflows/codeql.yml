name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      - name: Preserve exact security findings for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-findings-${{ github.sha }}
          path: codeql-results/*.sarif
          retention-days: 1
          if-no-files-found: error
      - name: Summarize security finding locations
        if: always()
        run: node scripts/summarize-codeql.mjs codeql-results
