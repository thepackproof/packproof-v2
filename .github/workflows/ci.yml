name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json
      - name: Install shared mobile dependencies
        run: npm ci
        working-directory: mobile
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - name: Install shared mobile dependencies
        run: npm ci
        working-directory: mobile
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  migrations-postgres:
    name: PostgreSQL migration concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: packproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d packproof_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Verify concurrent PostgreSQL startup migrations
        working-directory: backend
        env:
          PACKPROOF_MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/packproof_test
        run: npm test -- tests/migrations.test.ts

  deployment-scripts:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell and runtime preservation
        shell: pwsh
        run: ./infra/tests/deployment-helpers.test.ps1
