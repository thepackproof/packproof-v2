name: Pinned Logistics installer upgrade
on:
  push:
    branches: [qa/logistics-qualification]

permissions:
  contents: read
  actions: read

concurrency:
  group: qa-logistics-installed-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade / pinned development installer
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      APP_ENV: development
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CANDIDATE_COMMIT: 0e561e76c5c2723e1af7f75301abbd60802f9af9
      COMMERCE_BASE: 63843c5616dce4ce5824015f975fd0ac6327012d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact development inputs and verify their hashes
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVED_BASELINE: ${{ vars.PACKPROOF_CONNECT_060_QUALIFICATION_ARCHIVE_URL }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $artifacts = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts"
          $meta = Invoke-RestMethod -Uri "$artifacts/14656179347" -Headers $headers
          if ($meta.id -ne 14656179347 -or $meta.workflow_run.id -ne 44791562269 -or $meta.expired -or
              $meta.name -ne "packproof-unified-DEVELOPMENT-win32-x64-$env:CANDIDATE_COMMIT") { throw 'Pinned candidate artifact metadata mismatch.' }
          $archive = Join-Path $env:RUNNER_TEMP 'candidate.zip'
          Invoke-WebRequest -Uri "$artifacts/14656179347/zip" -Headers $headers -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ne '8f7e6fed1334ed5664dae5b751f3b51bc2a89ac387210df3b738a594d49f4fbd') { throw 'Candidate archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath candidate
          $exe = 'candidate/PackProof-Connect-development-Setup-0.7.0.exe'
          if ((Get-FileHash -LiteralPath $exe).Hash -ne 'ca13d7116fbc4293c824788232aaace10b0aaf069f4885e3ef8d2b8860fed0f6') { throw 'Candidate executable checksum mismatch.' }
          $prior = Join-Path $env:RUNNER_TEMP 'packproof-connect-pr175.zip'
          if ($env:ARCHIVED_BASELINE) {
            $uri = [uri]$env:ARCHIVED_BASELINE
            if ($uri.Scheme -ne 'https' -or $uri.UserInfo) { throw 'Expected an HTTPS release archive location.' }
            Invoke-WebRequest -Uri $uri -OutFile $prior
          } else {
            Invoke-WebRequest -Uri "$artifacts/14587903702/zip" -Headers $headers -OutFile $prior
          }
          if ((Get-FileHash -LiteralPath $prior).Hash -ne '00279cff2fc00e14fdaba0126a1c9b7c356b93ed41ed982a60f34ea04dea001e') { throw 'Previous Connect archive checksum mismatch.' }
      - uses: actions/checkout@v4
        with:
          ref: 63843c5616dce4ce5824015f975fd0ac6327012d
          path: previous
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            previous/desktop/package-lock.json
      - name: Install frozen desktop and backend fixture dependencies
        run: |
          if ((git -C previous rev-parse HEAD).Trim() -ne $env:COMMERCE_BASE) { throw 'Unexpected Commerce baseline checkout.' }
          npm ci --prefix previous/desktop --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Restore the historical Commerce installer
        id: prior
        uses: actions/cache/restore@v4
        with:
          path: |
            previous/desktop/release/development/win32-x64/PackProof-Dev-Setup-*.exe
            previous/desktop/release/development/win32-x64/release-evidence.json
            previous/desktop/release/development/win32-x64/SHA256SUMS
          key: qa-logistics-win2025-prior-commerce-v1-63843c5616dce4ce5824015f975fd0ac6327012d
      - name: Build and verify the frozen historical Commerce package on cache miss
        if: steps.prior.outputs.cache-hit != 'true'
        working-directory: previous/desktop
        env:
          PACKPROOF_API_BASE_URL: ${{ vars.PACKPROOF_DESKTOP_DEV_API_BASE_URL || 'https://pa-5faf90eb81cb4764b37bd3dc259a5ac4.ecs.us-east-1.on.aws' }}
          PACKPROOF_WEB_BASE_URL: https://thepackproof.com
          PACKPROOF_COGNITO_REGION: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_REGION || 'us-east-1' }}
          PACKPROOF_COGNITO_CLIENT_ID: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_CLIENT_ID || '34pnucunllka2jcs8hsq762m5e' }}
          PACKPROOF_COGNITO_USER_POOL_ID: ${{ vars.PACKPROOF_DESKTOP_DEV_COGNITO_USER_POOL_ID || 'us-east-1_GdgTeYaOO' }}
        run: |
          npm run package:win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The frozen verifier only accepts source provenance through its process environment.
          # Bind that one child to the actual baseline checkout. Keep the QA runner SHA intact.
          $baseline = (git rev-parse HEAD).Trim()
          if ($baseline -ne $env:COMMERCE_BASE) { throw 'Historical checkout changed before verification.' }
          $verify = [Diagnostics.ProcessStartInfo]::new((Get-Command node).Source)
          $verify.WorkingDirectory = (Get-Location).Path
          $verify.UseShellExecute = $false
          $verify.ArgumentList.Add('scripts/verify-artifacts.cjs')
          $verify.Environment['GITHUB_SHA'] = $baseline
          $process = [Diagnostics.Process]::Start($verify)
          $process.WaitForExit()
          if ($process.ExitCode) { exit $process.ExitCode }
      - name: Cache the verified baseline for repeated diagnostic pushes
        if: steps.prior.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            previous/desktop/release/development/win32-x64/PackProof-Dev-Setup-*.exe
            previous/desktop/release/development/win32-x64/release-evidence.json
            previous/desktop/release/development/win32-x64/SHA256SUMS
          key: ${{ steps.prior.outputs.cache-primary-key }}
      - name: Rehearse the pinned upgrade with the checked-out QA scripts
        run: |
          $params = @{
            Mode = 'Upgrade'
            CandidateCommit = $env:CANDIDATE_COMMIT
            CandidateDirectory = (Resolve-Path candidate).Path
            PriorConnectArchive = Join-Path $env:RUNNER_TEMP 'packproof-connect-pr175.zip'
            PriorCommerceSource = (Resolve-Path previous/desktop).Path
            PriorCommerceDirectory = (Resolve-Path previous/desktop/release/development/win32-x64).Path
          }
          ./connect-windows/scripts/smoke-logistics-upgrade.ps1 @params
      - name: Preserve the upgrade receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-upgrade-${{ github.sha }}-${{ github.run_attempt }}
          path: candidate/logistics-install-Upgrade.json
          if-no-files-found: warn
          retention-days: 2
