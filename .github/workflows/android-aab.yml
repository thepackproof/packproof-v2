name: Android AAB

on:
  push:
    branches: [main, codex/proof-record-parity]
    paths:
      - "mobile/**"
      - "packages/onboarding/**"
      - ".github/workflows/android-aab.yml"
      - ".github/actions/expo-auth/**"
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Signed Android release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      EXPO_PUBLIC_PACKPROOF_BUILD_SHA: ${{ github.sha }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@24.4.2

      - name: Install shared contract test runner
        working-directory: backend
        run: npm ci

      - name: Validate mobile and resolve release identity
        id: release
        working-directory: mobile
        run: |
          npm run typecheck
          npm run test:proof-record
          npm run test:recovery
          npm run test:intake
          npm run test:build-security
          npm run test:redesign
          node --test tests/font-assets.test.cjs
          node --import ../backend/node_modules/tsx/dist/loader.mjs --test tests/workspace-summary.test.ts
          node <<'NODE'
          const fs = require('fs');
          const profiles = require('./eas.json').build;
          const environmentLayers = [];
          for (let name = 'production'; name; name = profiles[name].extends) {
            environmentLayers.unshift(profiles[name].env || {});
          }
          Object.assign(process.env, ...environmentLayers, { EAS_BUILD_PROFILE: 'production' });
          const { expo } = require('./app.config.js');
          if (expo.android.package !== 'com.packproof.mobile') throw new Error('Unexpected Android package');
          if (!/^\d+\.\d+(?:\.\d+)?$/.test(expo.version) || !Number.isSafeInteger(expo.android.versionCode)) throw new Error('Invalid release identity');
          if (expo.extra.packproofMobileTaskUx !== true || expo.extra.packproofInternalReview) throw new Error('Production UX configuration is incorrect');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact=packproof-${expo.version}-${expo.android.versionCode}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${expo.version}\nversionCode=${expo.android.versionCode}\n`);
          NODE

      - name: Authenticate with existing Expo credential
        uses: ./.github/actions/expo-auth

      - name: Build signed Android App Bundle
        working-directory: mobile
        env:
          EAS_BUILD_PROFILE: production
          PACKPROOF_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          PACKPROOF_EXPECTED_VERSION_CODE: ${{ steps.release.outputs.versionCode }}
        run: |
          set -euo pipefail
          mkdir -p dist
          eas build --platform android --profile production --non-interactive --freeze-credentials --wait --json > dist/eas-build.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('dist/eas-build.json', 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          const url = build?.artifacts?.buildUrl || build?.artifactUrl;
          if (build?.status !== 'FINISHED' || !url) {
            console.error('EAS did not finish a signed Android App Bundle.');
            process.exit(1);
          }
          if (build.gitCommitHash !== process.env.GITHUB_SHA) {
            throw new Error('EAS build source revision does not match the requested GitHub commit.');
          }
          if (build.platform !== 'ANDROID' || build.distribution !== 'STORE' || build.buildProfile !== 'production'
            || build.appIdentifier !== 'com.packproof.mobile' || build.appVersion !== process.env.PACKPROOF_EXPECTED_VERSION
            || String(build.appBuildVersion) !== process.env.PACKPROOF_EXPECTED_VERSION_CODE) {
            throw new Error('EAS artifact identity does not match the production release configuration.');
          }
          fs.writeFileSync('dist/aab-url.txt', url + '\n');
          NODE
          curl --fail --location "$(cat dist/aab-url.txt)" --output "dist/${{ steps.release.outputs.artifact }}.aab"
          test -s "dist/${{ steps.release.outputs.artifact }}.aab"
          keytool -printcert -jarfile "dist/${{ steps.release.outputs.artifact }}.aab" > dist/upload-certificate.txt
          grep -F '75:25:B4:FC:9A:9D:03:4A:E2:94:92:2A:D4:3D:B1:84:43:D0:E1:4D' dist/upload-certificate.txt
          python3 scripts/check-aab-release.py "dist/${{ steps.release.outputs.artifact }}.aab" > dist/android-release-verification.json
          sha256sum "dist/${{ steps.release.outputs.artifact }}.aab" > dist/SHA256SUMS

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact }}-aab
          path: |
            mobile/dist/${{ steps.release.outputs.artifact }}.aab
            mobile/dist/SHA256SUMS
            mobile/dist/upload-certificate.txt
            mobile/dist/eas-build.json
            mobile/dist/android-release-verification.json
          if-no-files-found: error
          retention-days: 30
