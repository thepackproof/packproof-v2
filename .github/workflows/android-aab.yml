name: Android AAB

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-aab.yml"
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Signed internal AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check Expo automation token
        id: expo-auth
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed AAB build skipped because the EXPO_TOKEN repository secret is not configured. Add the Expo automation token and re-run this workflow; the existing EAS remote Play signing credentials will be reused."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mobile dependencies
        if: steps.expo-auth.outputs.available == 'true'
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        if: steps.expo-auth.outputs.available == 'true'
        run: npm install --global eas-cli@latest

      - name: Build signed Android App Bundle
        if: steps.expo-auth.outputs.available == 'true'
        working-directory: mobile
        run: |
          mkdir -p dist
          eas build --platform android --profile internal-staging --non-interactive --wait --json > dist/eas-build.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('dist/eas-build.json', 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          const url = build?.artifacts?.buildUrl || build?.artifactUrl;
          if (!url) {
            console.error('EAS did not return an Android build artifact URL.');
            process.exit(1);
          }
          fs.writeFileSync('dist/aab-url.txt', url + '\n');
          NODE
          curl --fail --location "$(cat dist/aab-url.txt)" --output dist/packproof-v2-internal-28.aab
          test -s dist/packproof-v2-internal-28.aab

      - name: Upload AAB artifact
        if: steps.expo-auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packproof-v2-internal-28-aab
          path: mobile/dist/packproof-v2-internal-28.aab
          if-no-files-found: error
          retention-days: 30
