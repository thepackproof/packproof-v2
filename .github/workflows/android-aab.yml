name: Android AAB

on:
  push:
    branches: [main, codex/proof-record-parity]
    paths:
      - "mobile/**"
      - ".github/workflows/android-aab.yml"
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Signed internal AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_PACKPROOF_BUILD_SHA: ${{ github.sha }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check Expo automation token
        id: expo-auth
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::The signed Android App Bundle was not built because EXPO_TOKEN is not configured. Configure the authorized Expo automation token and re-run; the existing EAS remote Play signing credentials will be reused."
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mobile dependencies
        if: steps.expo-auth.outputs.available == 'true'
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        if: steps.expo-auth.outputs.available == 'true'
        run: npm install --global eas-cli@24.4.2

      - name: Install shared contract test runner
        working-directory: backend
        run: npm ci

      - name: Validate mobile and resolve release identity
        id: release
        working-directory: mobile
        run: |
          npm run typecheck
          npm run test:proof-record
          npm run test:recovery
          npm run test:intake
          npm run test:build-security
          node <<'NODE'
          const fs = require('fs');
          const { expo } = require('./app.config.js');
          if (expo.android.package !== 'com.packproof.mobile') throw new Error('Unexpected Android package');
          if (!/^\d+\.\d+(?:\.\d+)?$/.test(expo.version) || !Number.isSafeInteger(expo.android.versionCode)) throw new Error('Invalid release identity');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact=packproof-${expo.version}-${expo.android.versionCode}\n`);
          NODE

      - name: Build signed Android App Bundle
        if: steps.expo-auth.outputs.available == 'true'
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p dist
          eas build --platform android --profile shipping-integration --non-interactive --wait --json > dist/eas-build.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('dist/eas-build.json', 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          const url = build?.artifacts?.buildUrl || build?.artifactUrl;
          if (build?.status !== 'FINISHED' || !url) {
            console.error('EAS did not finish a signed Android App Bundle.');
            process.exit(1);
          }
          fs.writeFileSync('dist/aab-url.txt', url + '\n');
          NODE
          curl --fail --location "$(cat dist/aab-url.txt)" --output "dist/${{ steps.release.outputs.artifact }}.aab"
          test -s "dist/${{ steps.release.outputs.artifact }}.aab"
          keytool -printcert -jarfile "dist/${{ steps.release.outputs.artifact }}.aab" > dist/upload-certificate.txt
          grep -F '75:25:B4:FC:9A:9D:03:4A:E2:94:92:2A:D4:3D:B1:84:43:D0:E1:4D' dist/upload-certificate.txt
          sha256sum "dist/${{ steps.release.outputs.artifact }}.aab" > dist/SHA256SUMS

      - name: Upload AAB artifact
        if: steps.expo-auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact }}-aab
          path: |
            mobile/dist/${{ steps.release.outputs.artifact }}.aab
            mobile/dist/SHA256SUMS
            mobile/dist/upload-certificate.txt
            mobile/dist/eas-build.json
          if-no-files-found: error
          retention-days: 30
