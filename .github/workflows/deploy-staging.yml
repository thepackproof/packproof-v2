name: Deploy staging parity

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      # Web compilation consumes shared mobile modules and their dependencies.
      - "mobile/**"
      - "infra/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: packproof-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  verify-ci:
    name: Require CI for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for successful main CI
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Staging deployment requires the main branch.');
            }
            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'ci.yml', head_sha: context.sha, event: 'push', per_page: 10,
              });
              const run = data.workflow_runs.filter(r => r.head_branch === 'main')
                .sort((a, b) => b.id - a.id)[0];
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(`CI for ${context.sha} ended with ${run.conclusion}: ${run.html_url}`);
                }
                core.info(`Verified CI for ${context.sha}: ${run.html_url}`);
                return;
              }
              core.info(`Waiting for CI on ${context.sha} (${run?.status ?? 'not started'})`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error(`No successful CI run for ${context.sha} within 20 minutes.`);

  deploy:
    name: API + web staging parity
    needs: verify-ci
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN_SECRET: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      - name: Validate deployment PowerShell
        shell: pwsh
        run: |
          foreach ($path in (Get-ChildItem infra -Filter *.ps1 -Recurse).FullName) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "$path contains PowerShell syntax errors"
            }
          }

      - name: Configure AWS with OIDC role
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS with repository credentials
        if: ${{ env.AWS_ROLE_ARN == '' && env.AWS_ACCESS_KEY_ID_SECRET != '' && env.AWS_SECRET_ACCESS_KEY_SECRET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_SECRET }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_SECRET }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Require AWS deployment authentication
        shell: pwsh
        run: |
          try {
            $identity = aws sts get-caller-identity --output json | ConvertFrom-Json
          } catch {
            throw "AWS deployment authentication is not configured. Set repository variable AWS_DEPLOY_ROLE_ARN for GitHub OIDC, or repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
          }
          if ($LASTEXITCODE -ne 0 -or -not $identity.Account) {
            throw "AWS deployment authentication is not configured. Set repository variable AWS_DEPLOY_ROLE_ARN for GitHub OIDC, or repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
          }
          Write-Host "Deploying to AWS account $($identity.Account)"

      - name: Install shared mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Deploy current commit to staging API and web
        shell: pwsh
        run: ./infra/deploy-staging-current.ps1 -Region $env:AWS_REGION

      - name: Verify exact API and web release
        shell: pwsh
        run: |
          function AwsJson([string[]]$Args) {
            $raw = & aws @Args
            if ($LASTEXITCODE -ne 0) { throw "aws $($Args -join ' ') failed" }
            return ($raw | ConvertFrom-Json)
          }

          $foundation = AwsJson @("cloudformation", "describe-stacks", "--stack-name", "packproof-v2-staging", "--region", $env:AWS_REGION, "--output", "json")
          $cluster = ($foundation.Stacks[0].Outputs | Where-Object OutputKey -eq "ClusterName").OutputValue
          $service = AwsJson @("ecs", "describe-services", "--cluster", $cluster, "--services", "packproof-v2-staging-api", "--region", $env:AWS_REGION, "--output", "json")
          $serviceArn = $service.services[0].serviceArn
          $express = AwsJson @("ecs", "describe-express-gateway-service", "--service-arn", $serviceArn, "--region", $env:AWS_REGION, "--output", "json")
          $endpoint = $express.service.activeConfigurations[0].ingressPaths[0].endpoint
          $apiUrl = $endpoint.TrimEnd("/")
          if ($apiUrl -notmatch "^https?://") { $apiUrl = "https://$apiUrl" }

          $webStack = AwsJson @("cloudformation", "describe-stacks", "--stack-name", "packproof-v2-staging-web", "--region", $env:AWS_REGION, "--output", "json")
          $webUrl = (($webStack.Stacks[0].Outputs | Where-Object OutputKey -eq "WebUrl").OutputValue).TrimEnd("/")

          $meta = Invoke-RestMethod -Uri "$apiUrl/meta" -Method Get
          if ($meta.commit -ne $env:GITHUB_SHA) {
            throw "API parity check failed: /meta reports $($meta.commit), expected $env:GITHUB_SHA"
          }
          if ($meta.environment -ne "staging") {
            throw "API parity check failed: /meta environment is $($meta.environment)"
          }

          $release = Invoke-RestMethod -Uri "$webUrl/release.json" -Headers @{ "Cache-Control" = "no-cache" }
          if ($release.commit -ne $env:GITHUB_SHA -or $release.environment -ne "staging" -or $release.apiUrl.TrimEnd("/") -ne $apiUrl) {
            throw "Web parity check failed: release metadata does not match the requested commit and API"
          }
          $indexFile = Join-Path $env:RUNNER_TEMP "packproof-live-index.html"
          Invoke-WebRequest -Uri "$webUrl/" -OutFile $indexFile -Headers @{ "Cache-Control" = "no-cache" }
          if ((Get-FileHash $indexFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $release.indexSha256) {
            throw "Web parity check failed: served index does not match the release hash"
          }
          foreach ($asset in $release.assets) {
            $assetFile = Join-Path $env:RUNNER_TEMP "packproof-live-asset"
            Invoke-WebRequest -Uri "$webUrl/$($asset.path)" -OutFile $assetFile -Headers @{ "Cache-Control" = "no-cache" }
            if ((Get-FileHash $assetFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) {
              throw "Web parity check failed: served asset $($asset.path) does not match the release hash"
            }
          }

          "### PackProof staging parity" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- API: $apiUrl" >> $env:GITHUB_STEP_SUMMARY
          "- Web: $webUrl" >> $env:GITHUB_STEP_SUMMARY
          "- API /meta exact commit: verified" >> $env:GITHUB_STEP_SUMMARY
          "- Web exact commit, index and asset hashes: verified" >> $env:GITHUB_STEP_SUMMARY
