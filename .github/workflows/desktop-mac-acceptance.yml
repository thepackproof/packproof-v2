name: Native customer flow verification
on:
  workflow_dispatch:
    inputs:
      androidPackage:
        type: choice
        default: play
        options: [play, published-bundle-test-signature, candidate-bundle-test-signature, diagnostic-only]
        description: Keep Play-distributed and bundle-derived evidence separate
      candidateBuildRun:
        type: string
        default: ''
        description: Successful main-branch Android AAB workflow run for candidate 65
      candidateSourceSha:
        type: string
        default: ''
        description: Exact main source revision of candidate 65
      candidateAabSha256:
        type: string
        default: ''
        description: Independently downloaded candidate 65 bundle SHA-256
      platform:
        type: choice
        default: all
        options: [all, mac, android]
        description: Released platform to verify
      authenticated:
        type: boolean
        default: false
        description: Use temporary isolated test accounts
permissions:
  contents: read
  actions: read
concurrency:
  group: customer-flow-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  mac:
    if: inputs.platform != 'android'
    name: Signed Mac customer flow / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the exact released signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/mac-candidate-provenance.cjs desktop/docs/mac-acceptance-candidate.json '${{ matrix.arch }}' "$RUNNER_TEMP/mac-provenance.json" "$RUNNER_TEMP/signed-mac"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: npm install --prefix "$RUNNER_TEMP/customer-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Operate the unchanged production application
        env:
          CUSTOMER_TOOLS: ${{ runner.temp }}/customer-tools
          CUSTOMER_FLOW_CREDENTIALS: ${{ inputs.authenticated && secrets.CUSTOMER_FLOW_CREDENTIALS || '' }}
        run: node desktop/scripts/customer-mac-flow.cjs
      - name: Save sanitized customer-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-mac-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mac-provenance.json
            ${{ runner.temp }}/customer-mac/
          retention-days: 30
  android:
    if: inputs.platform != 'mac'
    name: Android customer flow (${{ inputs.androidPackage }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Allow hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download and verify the exact Play-signed universal APK
        if: inputs.androidPackage == 'play'
        env:
          APK_URL: ${{ secrets.CUSTOMER_FLOW_APK_URL }}
        run: |
          node -e 'const fs=require("fs");fetch(process.env.APK_URL).then(async r=>{if(!r.ok)throw Error("APK download failed");fs.writeFileSync(process.env.RUNNER_TEMP+"/64.apk",Buffer.from(await r.arrayBuffer()));}).catch(()=>process.exit(1))'
          echo "97a7f08a95938cdab1c1b91a911195cdfe7d119db6e0a2eb21c6e903a6fe88b3  $RUNNER_TEMP/64.apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/64.apk"
      - name: Generate an isolated test installation from the unchanged published bundle
        if: inputs.androidPackage != 'play'
        env:
          AAB_URL: ${{ secrets.CUSTOMER_FLOW_AAB_URL }}
          GH_TOKEN: ${{ github.token }}
          CUSTOMER_ANDROID_PACKAGE: ${{ inputs.androidPackage }}
          CANDIDATE_BUILD_RUN: ${{ inputs.candidateBuildRun }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidateSourceSha }}
          CANDIDATE_AAB_SHA256: ${{ inputs.candidateAabSha256 }}
        run: |
          node desktop/scripts/customer-android-bundle.cjs
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          keytool -genkeypair -keystore "$RUNNER_TEMP/test-signature.jks" -alias native-flow-test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=PackProof isolated emulator test' -storepass android -keypass android
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$RUNNER_TEMP/64.aab" --output="$RUNNER_TEMP/64.apks" --mode=universal --ks="$RUNNER_TEMP/test-signature.jks" --ks-key-alias=native-flow-test --ks-pass=pass:android --key-pass=pass:android
          unzip -p "$RUNNER_TEMP/64.apks" universal.apk > "$RUNNER_TEMP/64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/64.apk"
      - name: Build temporary diagnostic JavaScript (never release evidence)
        if: inputs.androidPackage == 'diagnostic-only'
        run: |
          npm ci --prefix mobile --no-audit --no-fund
          node desktop/scripts/customer-android-diagnostic.cjs
      - name: Operate the released Android application
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          CUSTOMER_FLOW_CREDENTIALS: ${{ inputs.authenticated && secrets.CUSTOMER_FLOW_CREDENTIALS || '' }}
          CUSTOMER_ANDROID_PACKAGE: ${{ inputs.androidPackage }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidateSourceSha }}
          CANDIDATE_AAB_SHA256: ${{ inputs.candidateAabSha256 }}
          CANDIDATE_BUILD_RUN: ${{ inputs.candidateBuildRun }}
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: python3 desktop/scripts/customer-android-flow.py
      - name: Save sanitized customer-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-${{ github.run_attempt }}
          path: ${{ runner.temp }}/customer-android/
          retention-days: 30
