<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>PackProof Claims</title><link rel="stylesheet" href="sidebar.css"></head>
<body><main><header><strong>PackProof</strong><span>Evidence for this ticket</span></header>
<p id="status" role="status" aria-live="polite">Reading ticket references…</p>
<section id="results" aria-label="Matching Proofs"></section>
<form id="lookup"><label for="kind">Find a Proof by</label><select id="kind"><option value="orderId">Order reference</option><option value="trackingNumber">Tracking number</option><option value="proofId">Proof ID</option></select>
<label for="identifier">Reference</label><input id="identifier" maxlength="200" autocomplete="off" required><button id="search" type="submit">Find Proof</button></form>
<p class="note">PackProof preserves evidence and reports its integrity state. The claims decision remains with your team.</p></main>
<script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script><script src="sidebar.js"></script></body></html>
