[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "packproof-proofcollective-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Isolated synthetic federated quality research with Flower SecAgg+"
dependencies = ["flwr==1.39.0", "dp-accounting==0.6.0", "cryptography==46.0.7", "numpy==2.5.3"]
[project.scripts]
proofcollective = "proofcollective.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
