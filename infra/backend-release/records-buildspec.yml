# Start on the existing CodeBuild project with sourceTypeOverride=NO_SOURCE.
# The reviewed source SHA is public build metadata, never a credential.
version: 0.2
phases:
  pre_build:
    on-failure: ABORT
    commands:
      - test "$AWS_DEFAULT_REGION" = us-east-1
      - test "$(aws sts get-caller-identity --query Account --output text)" = 784514617543
      - printf '%s' "$REVIEWED_SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
      - git init records-source
      - cd records-source
      - git remote add origin https://github.com/thepackproof/packproof-v2.git
      - git fetch --depth=1 origin "$REVIEWED_SOURCE_SHA"
      - git checkout --detach "$REVIEWED_SOURCE_SHA"
      - test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE_SHA"
      - test -z "$(git status --porcelain)"
      - ECR=784514617543.dkr.ecr.us-east-1.amazonaws.com/packproof-v2-staging-api
      - export ECR
      - |
        aws ecr get-lifecycle-policy --repository-name packproof-v2-staging-api --output json > /tmp/records-retention.json
        aws ecr describe-images --repository-name packproof-v2-staging-api --output json > /tmp/records-images.json
        node --input-type=module <<'JS'
        import {readFileSync} from 'node:fs';
        const policy=JSON.parse(JSON.parse(readFileSync('/tmp/records-retention.json','utf8')).lifecyclePolicyText);
        const images=JSON.parse(readFileSync('/tmp/records-images.json','utf8')).imageDetails.sort((a,b)=>Date.parse(b.imagePushedAt)-Date.parse(a.imagePushedAt));
        const rollback='sha256:434f5cd40bf365a6bdf585fa6302f786ea4571dda892fd761c3dbd85d6b5aa54';
        const index=images.findIndex(row=>row.imageDigest===rollback),rule=policy.rules?.[0];
        if(policy.rules.length!==1||rule.selection?.tagStatus!=='any'||rule.selection?.countType!=='imageCountMoreThan'||rule.action?.type!=='expire'||index<0||rule.selection.countNumber<index+3)throw Error('RECORDS_ROLLBACK_RETENTION_NOT_QUALIFIED');
        for(const prefix of ['records-bridge-','records-v1-'])if(images.some(row=>row.imageTags?.includes(prefix+process.env.REVIEWED_SOURCE_SHA)))throw Error('RECORDS_CANDIDATE_TAG_ALREADY_EXISTS');
        JS
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 784514617543.dkr.ecr.us-east-1.amazonaws.com
  build:
    on-failure: ABORT
    commands:
      - docker build --label "org.opencontainers.image.revision=$REVIEWED_SOURCE_SHA" --label packproof.release.profile=records-inactive-bridge-v1 -t "$ECR:records-bridge-$REVIEWED_SOURCE_SHA" -f backend/Dockerfile.records-bridge .
      - docker build --label "org.opencontainers.image.revision=$REVIEWED_SOURCE_SHA" --label packproof.release.profile=records-v1 -t "$ECR:records-v1-$REVIEWED_SOURCE_SHA" -f backend/Dockerfile .
      - |
        docker run --rm -i --entrypoint node "$ECR:records-v1-$REVIEWED_SOURCE_SHA" --input-type=module <<'JS'
        import {readFile} from 'node:fs/promises';
        import {migrationInventory} from './dist/db/migrate.js';
        import {inspectInventory} from './scripts/records-migrate.mjs';
        const rows=await migrationInventory();
        const inventory=inspectInventory(rows,rows);
        if(process.getuid()===0)throw Error('NONROOT_RUNTIME_REQUIRED');
        for(const path of ['certs/rds-us-east-1-bundle.pem','scripts/records-runtime-privileges.mjs','scripts/records-migrate-cli.mjs'])await readFile(path);
        console.log(JSON.stringify({event:'records_image_source_inventory',nonRoot:true,sourceCount:rows.length,inventorySha256:inventory.inventorySha256,databaseQualification:false}));
        JS
      - docker run --rm --entrypoint sh "$ECR:records-v1-$REVIEWED_SOURCE_SHA" -c 'command -v ffmpeg && command -v ffprobe && command -v prlimit && apk info --installed "zlib>=1.3.2-r1"'
  post_build:
    on-failure: ABORT
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      - docker push "$ECR:records-bridge-$REVIEWED_SOURCE_SHA"
      - docker push "$ECR:records-v1-$REVIEWED_SOURCE_SHA"
      - aws ecr batch-get-image --repository-name packproof-v2-staging-api --image-ids "imageTag=records-bridge-$REVIEWED_SOURCE_SHA" "imageTag=records-v1-$REVIEWED_SOURCE_SHA" --query 'images[].imageId' --output json
