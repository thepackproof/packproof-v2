AWSTemplateFormatVersion: "2010-09-09"
Description: PackProof V2 API on ECS Express Mode / Fargate.

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedPattern: "^[a-z0-9-]+$"
    Description: PackProof environment identity exposed by GET /meta and used for credential namespaces.
  ServiceName:
    Type: String
    Default: packproof-v2-staging-api
  MinTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
  MaxTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
  ClusterName:
    Type: String
  ImageUri:
    Type: String
  PublicUrl:
    Type: String
    Default: ""
  TaskRoleArn:
    Type: String
  TaskExecutionRoleArn:
    Type: String
  InfrastructureRoleArn:
    Type: String
  PublicSubnetA:
    Type: String
  PublicSubnetB:
    Type: String
  DatabaseEndpoint:
    Type: String
  DatabasePort:
    Type: String
  DatabaseSecretArn:
    Type: String
  NotificationSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN with trackerLinkSecret, smtpUsername, and smtpPassword keys.
  WebhookSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing a base64 32-byte encryptionKey property.
  WebhookHosts:
    Type: String
    Default: ""
    Description: Comma-separated exact HTTPS webhook hostnames approved for delivery.
  SmtpHost:
    Type: String
    Default: email-smtp.us-east-1.amazonaws.com
  SmtpPort:
    Type: String
    Default: "465"
  EmailFrom:
    Type: String
    Default: ""
    Description: Verified sender address. Empty keeps SMTP email delivery disabled.
  LogGroupName:
    Type: String
  EvidenceBucket:
    Type: String
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  WebOrigins:
    Type: String
    Default: ""
    Description: Exact browser origins allowed by PACKPROOF_WEB_ORIGINS. Empty leaves CORS unset.
  ReleaseSha:
    Type: String
    Default: ""
    Description: Git commit SHA for GET /meta. Not a secret.
  ReleaseImage:
    Type: String
    Default: ""
    Description: Image tag for GET /meta. Not a secret.

Conditions:
  HasWebhookSecret: !Not [!Equals [!Ref WebhookSecretArn, ""]]
  HasNotificationSecret: !Not [!Equals [!Ref NotificationSecretArn, ""]]

Rules:
  ScalingRangeIsValid:
    Assertions:
      - Assert: !Not [!Equals [!Ref MaxTaskCount, 0]]
        AssertDescription: MaxTaskCount must be at least one.

Resources:
  ExpressService:
    Type: AWS::ECS::ExpressGatewayService
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ClusterName
      Cpu: "256"
      Memory: "1024"
      HealthCheckPath: /health
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      InfrastructureRoleArn: !Ref InfrastructureRoleArn
      NetworkConfiguration:
        Subnets:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
      ScalingTarget:
        MinTaskCount: !Ref MinTaskCount
        MaxTaskCount: !Ref MaxTaskCount
      PrimaryContainer:
        Image: !Ref ImageUri
        ContainerPort: 3000
        AwsLogsConfiguration:
          LogGroup: !Ref LogGroupName
          LogStreamPrefix: api
        Environment:
          - Name: NODE_ENV
            Value: production
          - Name: PORT
            Value: "3000"
          - Name: PACKPROOF_AUTH_MODE
            Value: cognito
          - Name: PACKPROOF_OBJECT_STORAGE
            Value: s3
          - Name: AWS_REGION
            Value: us-east-1
          - Name: PACKPROOF_S3_BUCKET
            Value: !Ref EvidenceBucket
          - Name: PACKPROOF_COGNITO_USER_POOL_ID
            Value: !Ref CognitoUserPoolId
          - Name: PACKPROOF_COGNITO_CLIENT_ID
            Value: !Ref CognitoClientId
          - Name: PACKPROOF_COGNITO_REGION
            Value: us-east-1
          - Name: PACKPROOF_DB_HOST
            Value: !Ref DatabaseEndpoint
          - Name: PACKPROOF_DB_PORT
            Value: !Ref DatabasePort
          - Name: PACKPROOF_DB_NAME
            Value: packproof_v2
          - Name: PACKPROOF_DB_SSLMODE
            Value: require
          - Name: PACKPROOF_PUBLIC_URL
            Value: !Ref PublicUrl
          - Name: PACKPROOF_WEB_ORIGINS
            Value: !Ref WebOrigins
          - Name: PACKPROOF_CREDENTIAL_STORE
            Value: secrets-manager
          - Name: PACKPROOF_ENVIRONMENT
            Value: !Ref EnvironmentName
          - Name: PACKPROOF_RELEASE_SHA
            Value: !Ref ReleaseSha
          - Name: PACKPROOF_RELEASE_IMAGE
            Value: !Ref ReleaseImage
          - Name: PACKPROOF_WEBHOOK_HOSTS
            Value: !Ref WebhookHosts
          - Name: PACKPROOF_SMTP_HOST
            Value: !Ref SmtpHost
          - Name: PACKPROOF_SMTP_PORT
            Value: !Ref SmtpPort
          - Name: PACKPROOF_EMAIL_FROM
            Value: !Ref EmailFrom
        Secrets:
          - !If
            - HasWebhookSecret
            - Name: PACKPROOF_WEBHOOK_ENCRYPTION_KEY
              ValueFrom: !Sub "${WebhookSecretArn}:encryptionKey::"
            - !Ref AWS::NoValue
          - Name: PACKPROOF_DB_USER
            ValueFrom: !Sub "${DatabaseSecretArn}:username::"
          - Name: PACKPROOF_DB_PASSWORD
            ValueFrom: !Sub "${DatabaseSecretArn}:password::"
          - !If
            - HasNotificationSecret
            - Name: PACKPROOF_TRACKER_LINK_SECRET
              ValueFrom: !Sub "${NotificationSecretArn}:trackerLinkSecret::"
            - !Ref AWS::NoValue
          - !If
            - HasNotificationSecret
            - Name: PACKPROOF_SMTP_USERNAME
              ValueFrom: !Sub "${NotificationSecretArn}:smtpUsername::"
            - !Ref AWS::NoValue
          - !If
            - HasNotificationSecret
            - Name: PACKPROOF_SMTP_PASSWORD
              ValueFrom: !Sub "${NotificationSecretArn}:smtpPassword::"
            - !Ref AWS::NoValue

Outputs:
  ServiceArn:
    Value: !GetAtt ExpressService.ServiceArn
  Endpoint:
    Value: !GetAtt ExpressService.Endpoint
  StagingEndpoint:
    Description: Backward-compatible output name; use Endpoint for new deployments.
    Value: !GetAtt ExpressService.Endpoint
  LoadBalancerArn:
    Value: !GetAtt ExpressService.ECSManagedResourceArns.IngressPath.LoadBalancerArn
