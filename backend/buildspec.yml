# Legacy CodeBuild default is intentionally inert. The image now requires a
# repository-root archive, shared contracts and the authorized profile marker.
# Governed API releases supply an exact-source buildspecOverride after review.
# Never authenticate to ECR, build, push latest or update a service from here.
version: 0.2
phases:
  pre_build:
    on-failure: ABORT
    commands:
      - 'echo "LEGACY_BACKEND_BUILD_DISABLED: use the governed repository-root API buildspec override described in docs/ADMIN_DEPLOYMENT_RUNBOOK.md." >&2; exit 2'
