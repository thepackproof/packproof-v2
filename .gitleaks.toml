# Reviewed against CI run 34087260300, Source secrets job 101633568556.
# Preserve every built-in rule. Each exception requires BOTH the exact path and exact
# reviewed non-secret value, and applies only to the named rule. No history is skipped.
title = "PackProof audited non-secret fixture exceptions"

