apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.packproof.unifiedcamera'
version = '0.1.0'

android {
  namespace 'com.packproof.unifiedcamera'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Match the shared CameraX runtime used by Expo SDK 53.
  def cameraxVersion = '1.4.1'
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-video:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
  // 17.3.0 includes 16 KB-compatible bundled barcode native libraries.
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
