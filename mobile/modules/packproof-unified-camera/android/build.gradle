apply plugin: 'com.android.library'

group = 'com.packproof.unifiedcamera'
version = '0.1.0'

// Use the Expo SDK 52 module API already installed by this application.
def expoModulesCorePlugin = new File(project(':expo-modules-core').projectDir.absolutePath, 'ExpoModulesCorePlugin.gradle')
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace 'com.packproof.unifiedcamera'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Match expo-camera 16.0.18: this spike does not upgrade shared native libraries.
  def cameraxVersion = '1.4.1'
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-video:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
  implementation 'com.google.mlkit:barcode-scanning:17.2.0'
}
